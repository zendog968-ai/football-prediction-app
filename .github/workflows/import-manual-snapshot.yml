name: Import Manual Market Snapshot

on:
  workflow_dispatch:
    inputs:
      snapshot_path:
        description: "Repository JSON path for the labelled manual snapshot"
        required: true
        type: string
        default: "supabase-sync/manual_snapshots/2026-09-26_atlante_monterrey.json"

permissions:
  contents: read

jobs:
  import-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r supabase-sync/requirements.txt
      - name: Import labelled manual snapshot and compare with Aurelia
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || vars.SUPABASE_SECRET_KEY }}
        run: >-
          python supabase-sync/scripts/import_manual_snapshot.py
          --snapshot "${{ inputs.snapshot_path }}"
          --report-out manual-snapshot-report.json
      - name: Upload auditable comparison report
        uses: actions/upload-artifact@v4
        with:
          name: manual-snapshot-comparison
          path: manual-snapshot-report.json
          if-no-files-found: error

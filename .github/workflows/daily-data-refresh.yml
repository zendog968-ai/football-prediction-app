name: Aurelia daily football data refresh

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      force_failure_drill:
        description: "Only for notification verification; stop before candidate data is built or released"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: aurelia-daily-data-refresh
  cancel-in-progress: false

jobs:
  build-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reproducible Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Verify completed-result reconciliation contract
        run: python -m unittest data-pipeline/test_daily_update.py
      - name: Run controlled notification failure drill
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_failure_drill }}
        run: |
          echo "Controlled failure drill: no candidate data or release assets are created."
          exit 1
      - name: Build and validate complete candidate release
        run: python data-pipeline/run_daily_refresh.py --output-dir build/daily
      - name: Retain audited candidate outputs
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-data-candidate-${{ github.run_id }}
          path: |
            build/daily/pipeline_status.json
            build/daily/result_sync_report.json
            build/daily/model/cross_validation_metrics.csv
            build/daily/model/model_report_zh-TW.md
            build/daily/smoke-*.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish only the validated versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_github_release.sh build/daily

  notify-on-failure:
    needs: [build-validate-publish]
    if: ${{ always() && needs['build-validate-publish'].result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create one actionable data-quality alert for this failed run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_TITLE: "[Aurelia Data Alert] Daily refresh failed · run ${{ github.run_id }}"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$RUN_TITLE" --json number --jq 'length' | grep -qx '0'; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$RUN_TITLE" --body "每日資料刷新或品質閘門未通過。既有不可變Release會繼續服務；請開啟工作流程紀錄查閱失敗步驟及保留的候選稽核檔案。\n\n失敗執行：[查看工作流程紀錄]($RUN_URL)\n\n此Issue由工作流程自動建立，同一run只會建立一次。"
          fi
      - name: Send failure alert to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram alert skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."
            exit 0
          fi
          MESSAGE="🚨 <b>Aurelia Football daily refresh 失敗</b>
          資料刷新或品質驗證未完成，既有版本繼續服務。
          查看詳細錯誤：${RUN_URL}"
          curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"

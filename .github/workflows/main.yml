name: Football Supabase Sync

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and calculate without Supabase writes"
        type: boolean
        default: false

concurrency:
  group: football-supabase-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: supabase-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: supabase-sync/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run research-tier sync with retry
        id: sync
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY || vars.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || vars.SUPABASE_SECRET_KEY }}
        run: |
          set +e
          mode=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then mode="--dry-run"; fi
          for attempt in 1 2 3; do
            echo "Sync attempt ${attempt}/3"
            python main.py ${mode} --report-out sync-report.json
            status=$?
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit "$status"
      - name: Send research summary to Telegram
        if: ${{ success() && inputs.dry_run != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python scripts/telegram_alert.py --kind success --report sync-report.json
      - name: Send failure alert to Telegram
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
        run: >-
          PYTHONPATH=. python scripts/telegram_alert.py --kind failure --detail
          "GitHub Actions sync failed after three attempts. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
